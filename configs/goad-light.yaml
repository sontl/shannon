    login_url: http://placeholder.local
    credentials:
      username: ""
      password: ""
    success_condition:
      type: url_contains
      value: "/"
  pipeline:
    mode: graybox
    target: network
    network:
      engagement_mode: internal
      scope:
        targets:
          - "192.168.56.10"
          - "192.168.56.11"
          - "192.168.56.22"
      ad:
        enabled: true
        domain: north.sevenkingdoms.local
