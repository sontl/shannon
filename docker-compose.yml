services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--db-filename", "/home/temporal/temporal.db", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:7233:7233"   # gRPC
      - "127.0.0.1:8233:8233"   # Web UI (built-in)
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    entrypoint: ["node", "dist/temporal/worker.js"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}  # Optional: route through claude-code-router
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}  # Auth token for router
      - ROUTER_DEFAULT=${ROUTER_DEFAULT:-}  # Model name when using router (e.g., "gemini,gemini-2.5-pro")
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - CLAUDE_CODE_USE_VERTEX=${CLAUDE_CODE_USE_VERTEX:-}
      - CLOUD_ML_REGION=${CLOUD_ML_REGION:-}
      - ANTHROPIC_VERTEX_PROJECT_ID=${ANTHROPIC_VERTEX_PROJECT_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - ANTHROPIC_SMALL_MODEL=${ANTHROPIC_SMALL_MODEL:-}
      - ANTHROPIC_MEDIUM_MODEL=${ANTHROPIC_MEDIUM_MODEL:-}
      - ANTHROPIC_LARGE_MODEL=${ANTHROPIC_LARGE_MODEL:-}
      - CLAUDE_CODE_MAX_OUTPUT_TOKENS=${CLAUDE_CODE_MAX_OUTPUT_TOKENS:-64000}
      - APPIUM_URL=${APPIUM_URL:-}
      - APPIUM_APP_PATH=${APPIUM_APP_PATH:-}
      - APPIUM_DEVICE_ID=${APPIUM_DEVICE_ID:-}
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs
      - ./prompts:/app/prompts
      - ./audit-logs:/app/audit-logs
      - ${OUTPUT_DIR:-./audit-logs}:/app/output
      - ./credentials:/app/credentials:ro
      - ./repos:/repos:ro
      - ${BENCHMARKS_BASE:-.}:/benchmarks
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined

  # Optional: claude-code-router for multi-model support
  # Start with: ROUTER=true ./gandalf start ...
  router:
    image: node:20-slim
    profiles: ["router"]  # Only starts when explicitly requested
    command: >
      sh -c "apt-get update && apt-get install -y gettext-base &&
             npm install -g @musistudio/claude-code-router &&
             mkdir -p /root/.claude-code-router &&
             envsubst < /config/router-config.json > /root/.claude-code-router/config.json &&
             ccr start"
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      - ./configs/router-config.json:/config/router-config.json:ro
    environment:
      - HOST=0.0.0.0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ROUTER_DEFAULT=${ROUTER_DEFAULT:-openai,gpt-4o}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3456/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Network graybox sidecars (gated by Docker Compose profiles).
  # Start with: `docker compose --profile ad up` etc.
  # PR 1 wires the services; the agents that USE them ship in PR 3 (AD),
  # PR 4 (relay), PR 5 (creds) per plan inherited-marinating-hearth.md.
  # ============================================================

  # BloodHound CE — AD graph analysis. Agents upload bloodhound-python collector
  # output via the HTTP API; agents query attack paths via Cypher/REST.
  # Used by: network-ad-vuln, network-ad-exploit, network-postex-sim.
  bloodhound:
    profiles: ["ad", "network"]
    image: specterops/bloodhound:latest
    environment:
      bhe_database_connection: "user=bloodhound password=${BH_DB_PASS:-bloodhound} dbname=bloodhound host=bh-postgres port=5432"
      bhe_neo4j_connection: "bolt://neo4j:${NEO4J_PASS:-bloodhound}@bh-neo4j:7687/"
      bhe_default_admin_principal_name: "${BH_ADMIN_USER:-admin}"
      bhe_default_admin_email_address: "${BH_ADMIN_EMAIL:-admin@bloodhound.local}"
      bhe_default_admin_password: "${BH_ADMIN_PASS:-changeMe!}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      bh-postgres:
        condition: service_healthy
      bh-neo4j:
        condition: service_healthy

  bh-neo4j:
    profiles: ["ad", "network"]
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASS:-bloodhound}"
    volumes:
      - bh-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bh-postgres:
    profiles: ["ad", "network"]
    image: postgres:16
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: ${BH_DB_PASS:-bloodhound}
      POSTGRES_DB: bloodhound
    volumes:
      - bh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenVAS / Greenbone Vulnerability Manager — FOSS compliance-grade scanner.
  # Heavy: first start syncs the vuln DB (~30 minutes). Agents call the GMP API.
  # Used by: network-services-vuln (when pipeline.network.scanners.vuln_scanner = openvas).
  openvas:
    profiles: ["vuln-scan", "network"]
    image: immauss/openvas:latest
    environment:
      PASSWORD: ${OPENVAS_ADMIN_PASS:-admin}
      RELAYHOST: "noop"
    ports:
      - "127.0.0.1:9390:9390"   # GMP
      - "127.0.0.1:9392:9392"   # GSA (web UI, debugging only)
    volumes:
      - openvas-data:/data

  # Network relay sidecar — Responder + mitm6 + ntlmrelayx. Multicast traffic
  # (LLMNR / NBT-NS / mDNS) requires network_mode: host. NET_RAW + NET_ADMIN
  # caps are needed for raw sockets + interface manipulation.
  # Used by: network-relay-exploit (only when pipeline.network.relay.enabled = true).
  #
  # PR 1: this service is wired but the image isn't built. Add a Dockerfile.relay
  # in PR 4 (Responder + mitm6 + ntlmrelayx + time-boxed entrypoint) and replace
  # the placeholder image reference below.
  network-relay:
    profiles: ["relay", "network"]
    image: ${NETWORK_RELAY_IMAGE:-gandalf-network-relay:local}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./audit-logs:/audit-logs
    environment:
      RELAY_DURATION_MINUTES: ${RELAY_DURATION_MINUTES:-30}
      INTERFACE: ${RELAY_INTERFACE:-eth0}

volumes:
  temporal-data:
  bh-neo4j-data:
  bh-postgres-data:
  openvas-data:
